<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<div class="app">
<header class="top-header">
<div class="school">
<img class="logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj1RdEnoxYSP5qnP2-r2GajR5fU6Af7WSPyQtHCYAIpI27m8Zptnpr5vteAw_Y8KorIleCzYTUodc-fralUmth09qf0X3YrPY30PDDM67Xc8EOiNbo3PBOW9L35r5OvbQzEJ6vfcJolZvEALjf52i2ByB_iH9z2-LKWPRONIN2-r5H8JLdJq-AkM55Lckz6/s320/LOGO-ISVILL.webp" alt="Logo">
<div>
<h1>Student Attendance</h1>
<h2>Program Ziyadah</h2>
<p>SD Plus Islamic Village</p>
</div>
</div>
<div class="clock-area">
<div id="today">-</div>
<div id="clock">00:00:00</div>
</div>
</header>

<main class="content">
<section class="camera-card">
<div class="card-title">📷 Live Camera</div>
<div id="reader"></div>
<button id="switchCamera" class="btn-camera">🔄 Ganti Kamera</button>
<div class="status-bar"><span id="message">🟢 Scanner Aktif</span></div>
</section>

<section class="result-card">
<div class="card-title">📋 Hasil Scan</div>
<div id="resultBox" class="result waiting">
<div class="result-icon">📷</div>
<div class="result-title">Menunggu Scan...</div>
<div class="student-name" id="nama">-</div>
<div class="student-class">🏫 <span id="kelas">-</span></div>
<div class="student-status">📋 <span id="status">-</span></div>
<div class="student-time">🕒 <span id="scanTime">--:--:--</span></div>
<div class="student-note" id="keterangan">Silakan scan QR siswa</div>
</div>
</section>
</main>

<footer class="bottom-bar">
<button id="switchCameraFooter" class="btn-camera">🔄 Ganti Kamera</button>
<div class="footer-info"><strong>Version 1.1</strong></div>
</footer>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
<script>
function updateClock(){
 const now=new Date();
 document.getElementById('clock').textContent=now.toLocaleTimeString('id-ID');
 document.getElementById('today').textContent=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(updateClock,1000);
updateClock();
document.getElementById('switchCameraFooter').onclick=function(){
 document.getElementById('switchCamera').click();
};
</script>
</body>
</html>
